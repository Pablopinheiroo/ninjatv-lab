<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>SuperFlix Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #111; overflow: hidden; }
    #player { display: block; width: 100%; height: 100%; min-height: 240px; border: 0; background: #111; }
    #message { display: none; padding: 20px; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <iframe
    id="player"
    title="Player SuperFlix"
    allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *"
    allowfullscreen
    webkitallowfullscreen>
  </iframe>
  <div id="message" role="alert"></div>
  <script>
    (() => {
      "use strict";
      const params = new URLSearchParams(window.location.search);
      const type = (params.get("type") || "").trim().toLowerCase();
      const tmdb = (params.get("tmdb") || "").trim();
      const season = (params.get("season") || "").trim();
      const episode = (params.get("episode") || "").trim();
      const player = document.getElementById("player");
      const message = document.getElementById("message");
      const isNumericId = value => /^[0-9]{1,12}$/.test(value);

      function showError(text) {
        player.removeAttribute("src");
        player.style.display = "none";
        message.textContent = text;
        message.style.display = "block";
      }

      if (!["filme", "serie", "anime", "dorama"].includes(type)) {
        showError("Tipo inválido. Use filme, serie, anime ou dorama.");
        return;
      }
      if (!isNumericId(tmdb)) {
        showError("ID TMDB ausente ou inválido.");
        return;
      }

      let path;
      if (type === "filme") {
        if (season || episode) {
          showError("Filmes não usam temporada ou episódio.");
          return;
        }
        path = "/filme/" + tmdb;
      } else {
        path = "/serie/" + tmdb;
        if (season || episode) {
          if (!isNumericId(season) || !isNumericId(episode)) {
            showError("Informe temporada e episódio com números válidos.");
            return;
          }
          path += "/" + season + "/" + episode;
        }
      }
      player.src = "https://superflixapi.boats" + path;
    })();
  </script>
</body>
</html>
