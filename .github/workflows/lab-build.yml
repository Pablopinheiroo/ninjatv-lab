name: Lab Build (artifacts only)

on:
  push:
    branches:
      - "lab/turnstile-workers"
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - ".github/workflows/lab-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build plugins and catalog
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson

      - name: List generated plugin packages
        run: |
          find . -type f -name "*.cs3" -print
          test "$(find . -type f -name "*.cs3" | wc -l)" -ge 4

      - name: Publish repository link on isolated lab-builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../lab-publish
          cp */build/*.cs3 ../lab-publish/
          cp build/plugins.json ../lab-publish/plugins.json
          sed -i 's|/builds/|/lab-builds/|g' ../lab-publish/plugins.json
          cat > ../lab-publish/repo.json <<'EOF'
          {
            "name": "NinjaTV Lab — Catálogos",
            "description": "Catálogos SuperFlix de filmes, séries, animes e doramas com player HTML compartilhado; requer WebView.",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Pablopinheiroo/ninjatv-lab/lab-builds/plugins.json"
            ]
          }
          EOF
          cd ../lab-publish
          git init
          git checkout -b lab-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish isolated NinjaTV lab catalog packages"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/Pablopinheiroo/ninjatv-lab.git"
          git push --force origin HEAD:lab-builds

      - name: Upload lab artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ninjatv-lab-cs3
          path: |
            **/build/*.cs3
            build/plugins.json
          if-no-files-found: error
          retention-days: 14
