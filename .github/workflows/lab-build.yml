name: Lab Build (artifacts only)

on:
  push:
    branches:
      - "lab/turnstile-workers"
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - ".github/workflows/lab-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build plugins and catalog
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson

      - name: List generated plugin packages
        run: |
          find . -type f -name "*.cs3" -print
          test "$(find . -type f -name "*.cs3" | wc -l)" -ge 4

      - name: Upload lab artifacts (does not publish to builds)
        uses: actions/upload-artifact@v4
        with:
          name: ninjatv-lab-cs3
          path: |
            **/build/*.cs3
            build/plugins.json
          if-no-files-found: error
          retention-days: 14
